# Studio lint gate (seed: created once, then yours). Runs ESLint with the managed eslint.config.mjs.
# Strict from the start (this repo is clean): every finding is an error.
name: lint
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .
      strict:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  eslint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    env:
      STUDIO_LINT_STRICT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx eslint .
